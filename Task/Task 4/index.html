<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Profile Card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <button id="btn-tema" type="button">Ganti Tema</button>
      <button id="muat" type="button">Muat Ulang</button>
      <button id="coba-lagi" type="button" hidden>Coba Lagi</button>
    </header>

    <p id="status" role="status" aria-live="polite">Tekan tombol untuk memuat profil.</p>

    <article id="kartu-profil" class="kartu" hidden>
      <h1 id="profil-nama"></h1>
      <p id="profil-peran" class="peran"></p>
      
      <button id="btn-detail" type="button" aria-expanded="false">Tampilkan Detail</button>
      <div id="profil-detail" class="detail-content" hidden>
        <p id="profil-bio"></p>
      </div>

      <hr>

      <h2>Keterampilan</h2>
      <form id="form-skill" novalidate>
        <input id="input-skill" type="text" placeholder="Tambah keterampilan baru..." required>
        <button type="submit">Tambah</button>
      </form>
      <small id="error-skill" class="error"></small>

      <ul id="daftar-skill" class="list-skill"></ul>
      <p id="pesan-skill-kosong" class="pesan-kosong" hidden>Belum ada keterampilan.</p>
    </article>
  </main>
  <script src="js/app.js" defer></script>
</body>
</html>
